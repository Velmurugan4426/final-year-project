spring.application.name=learning-assistant

# ============================================================
# DATABASE
# ============================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ai_learning_assistant}

spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Run versioned PostgreSQL migrations before Hibernate changes the schema.
spring.flyway.locations=classpath:db/migration/{vendor}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.resume.storage-path=${RESUME_STORAGE_PATH:./uploads/resumes}

# ============================================================
# SERVER ERRORS
# ============================================================

server.error.include-message=always
server.error.include-stacktrace=never

# ============================================================
# JWT
# ============================================================

app.jwt.secret=${JWT_SECRET}

# ============================================================
# GEMINI
# ============================================================

gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}

# ============================================================
# GROQ
# ============================================================

groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
groq.transcription-model=${GROQ_TRANSCRIPTION_MODEL:whisper-large-v3-turbo}

# ============================================================
# GROK
# ============================================================

grok.api-key=${GROK_API_KEY:${XAI_API_KEY:}}
grok.model=${GROK_MODEL:grok-3-mini}

# ============================================================
# AI PROVIDER
# ============================================================

ai.provider=${AI_PROVIDER:gemini}
ai.request-timeout-seconds=${AI_REQUEST_TIMEOUT_SECONDS:20}

# ============================================================
# AI INTERVIEW
# ============================================================

ai-interview.admin-email=${AI_INTERVIEW_ADMIN_EMAIL}
ai-interview.price-paise=${AI_INTERVIEW_PRICE_PAISE:100}
ai-interview.upi-id=${AI_INTERVIEW_UPI_ID:}
ai-interview.upi-payee-name=${AI_INTERVIEW_UPI_PAYEE_NAME:AI Interview}
ai-interview.duration-minutes=${AI_INTERVIEW_DURATION_MINUTES:5}
ai-interview.heartbeat-timeout-minutes=${AI_INTERVIEW_HEARTBEAT_TIMEOUT_MINUTES:5}
ai-interview.expiry-check-ms=${AI_INTERVIEW_EXPIRY_CHECK_MS:30000}

# ============================================================
# RAZORPAY
# ============================================================

razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}