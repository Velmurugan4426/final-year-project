spring.application.name=learning-assistant

# ============================================================
# DATABASE
# ============================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/ai_learning_assistant
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# SERVER ERRORS
# ============================================================

server.error.include-message=always
server.error.include-stacktrace=never

# ============================================================
# JWT
# ============================================================

app.jwt.secret=${JWT_SECRET:}

# ============================================================
# GEMINI
# ============================================================

gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}

# ============================================================
# GROQ (used by the AI tutor)
# ============================================================

groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}

# ============================================================
# GROK (used as the quiz-generation fallback)
# ============================================================

grok.api-key=${GROK_API_KEY:${XAI_API_KEY:}}
grok.model=${GROK_MODEL:grok-3-mini}

# ============================================================
# AI PROVIDER
# ============================================================

# Gemini is primary.
# If Gemini fails/quota is exhausted, Groq is used automatically.
ai.provider=${AI_PROVIDER:gemini}